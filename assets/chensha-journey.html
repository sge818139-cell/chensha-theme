<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHENSHA - Cinnabar Journey</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
      background: #FAF6F0;
      color: #2A1F1A;
      overflow-x: hidden;
    }

    /* 导航栏 */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(250, 246, 240, 0.95);
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .logo {
      font-size: 28px;
      letter-spacing: 4px;
      color: #9E2B25;
      font-weight: 500;
    }

    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: #2A1F1A;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #9E2B25;
    }

    /* 主容器 */
    .journey-container {
      position: relative;
      height: 500vh;
      background: #FAF6F0;
    }

    /* 固定视口 */
    .viewport {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      perspective: 1200px;
      perspective-origin: 50% 40%;
    }

    /* 3D 场景 */
    .scene-3d {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    /* 地面 */
    .ground {
      position: absolute;
      bottom: -20%;
      left: 50%;
      transform: translateX(-50%) rotateX(70deg);
      width: 300%;
      height: 200%;
      background: 
        radial-gradient(ellipse at center, rgba(158,43,37,0.08) 0%, transparent 60%),
        linear-gradient(180deg, #F4EDE2 0%, #E8DCC8 100%);
      transform-origin: center bottom;
    }

    /* 远景层 */
    .layer-far {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0.3;
      pointer-events: none;
    }

    .mountain {
      position: absolute;
      bottom: 35%;
      width: 400px;
      height: 300px;
      background: #C9B896;
      clip-path: polygon(0 100%, 15% 50%, 35% 70%, 55% 30%, 75% 60%, 90% 40%, 100% 100%);
    }

    .mountain-left { left: 0; }
    .mountain-right { right: 0; transform: scale(1.3); }

    .cloud {
      position: absolute;
      width: 200px;
      height: 60px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
    }

    .cloud-1 { top: 20%; left: 15%; }
    .cloud-2 { top: 30%; right: 20%; }

    /* 中景层 */
    .layer-mid {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0.4;
      pointer-events: none;
    }

    .plant {
      position: absolute;
      bottom: 20%;
      width: 100px;
      height: 180px;
      background: #B8A888;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    .plant-left-1 { left: 3%; }
    .plant-left-2 { left: 12%; bottom: 15%; transform: scale(1.4); }
    .plant-right-1 { right: 3%; transform: scaleX(-1); }
    .plant-right-2 { right: 12%; bottom: 15%; transform: scaleX(-1) scale(1.4); }

    /* 主角 - 朱砂原石 */
    .hero {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 120px;
      z-index: 10;
      transition: transform 0.1s linear;
    }

    .hero-crystal {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #9E2B25 0%, #7A1F1A 100%);
      clip-path: polygon(50% 0%, 80% 20%, 100% 50%, 80% 80%, 50% 100%, 20% 80%, 0% 50%, 20% 20%);
      box-shadow: 0 0 40px rgba(158,43,37,0.4);
      animation: heroWalk 2s ease-in-out infinite;
    }

    .hero-shadow {
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 15px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.2) 0%, transparent 70%);
      border-radius: 50%;
    }

    @keyframes heroWalk {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* 场景卡片 */
    .scene-card {
      position: absolute;
      width: 280px;
      z-index: 5;
      opacity: 0;
      transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .scene-card.visible {
      opacity: 1;
    }

    .scene-1 { left: 10%; top: 30%; }
    .scene-2 { right: 10%; top: 30%; }
    .scene-3 { left: 10%; top: 30%; }
    .scene-4 { right: 10%; top: 30%; }

    .card-inner {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(158,43,37,0.15);
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .card-icon {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .icon-1 { background: linear-gradient(135deg, #9E2B25 0%, #7A1F1A 100%); }
    .icon-2 { background: linear-gradient(135deg, #C9A24B 0%, #9E2B25 100%); }
    .icon-3 { background: linear-gradient(135deg, #7A1F1A 0%, #2A1F1A 100%); }
    .icon-4 { background: linear-gradient(135deg, #9E2B25 0%, #C9A24B 100%); }

    .card-eyebrow {
      font-size: 12px;
      letter-spacing: 2px;
      color: #9E2B25;
      margin-bottom: 5px;
    }

    .card-title {
      font-size: 18px;
      color: #2A1F1A;
      font-weight: 500;
    }

    /* 底部标题 */
    .title-bar {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 8;
    }

    .title-eyebrow {
      font-size: 12px;
      letter-spacing: 4px;
      color: #9E2B25;
      margin-bottom: 10px;
    }

    .title-main {
      font-size: 36px;
      font-weight: 400;
      color: #2A1F1A;
      margin-bottom: 15px;
    }

    .title-line {
      width: 60px;
      height: 2px;
      background: #9E2B25;
      margin: 0 auto;
    }

    /* 结尾 */
    .finale {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #9E2B25 0%, #7A1F1A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .finale.visible {
      opacity: 1;
    }

    .finale-title {
      font-size: 48px;
      font-weight: 400;
      color: #FAF6F0;
      margin-bottom: 20px;
    }

    .finale-desc {
      font-size: 18px;
      color: #E0C88A;
      margin-bottom: 30px;
    }

    .finale-btn {
      display: inline-block;
      padding: 16px 50px;
      background: #C9A24B;
      color: #2A1F1A;
      text-decoration: none;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .finale-btn:hover {
      background: transparent;
      color: #C9A24B;
      border: 1px solid #C9A24B;
    }

    /* 进度条 */
    .progress {
      position: fixed;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 200px;
      background: rgba(158,43,37,0.1);
      z-index: 100;
    }

    .progress-fill {
      width: 100%;
      height: 0%;
      background: #9E2B25;
      transition: height 0.1s linear;
    }

    @media (max-width: 768px) {
      .nav {
        padding: 15px 20px;
      }
      .nav-links {
        display: none;
      }
      .hero {
        width: 80px;
        height: 80px;
      }
      .scene-card {
        width: 220px;
      }
      .scene-1, .scene-3 { left: 5%; }
      .scene-2, .scene-4 { right: 5%; }
      .title-main {
        font-size: 28px;
      }
      .finale-title {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>

  <!-- 导航栏 -->
  <nav class="nav">
    <div class="logo">CHENSHA</div>
    <ul class="nav-links">
      <li><a href="#">Collections</a></li>
      <li><a href="#">Bracelets</a></li>
      <li><a href="#">Our Story</a></li>
      <li><a href="#">Craft</a></li>
      <li><a href="#">Journal</a></li>
    </ul>
  </nav>

  <!-- 主旅程容器 -->
  <div class="journey-container">
    <div class="viewport">
      <div class="scene-3d">

        <!-- 地面 -->
        <div class="ground"></div>

        <!-- 远景层 -->
        <div class="layer-far">
          <div class="mountain mountain-left"></div>
          <div class="mountain mountain-right"></div>
          <div class="cloud cloud-1"></div>
          <div class="cloud cloud-2"></div>
        </div>

        <!-- 中景层 -->
        <div class="layer-mid">
          <div class="plant plant-left-1"></div>
          <div class="plant plant-left-2"></div>
          <div class="plant plant-right-1"></div>
          <div class="plant plant-right-2"></div>
        </div>

        <!-- 主角 -->
        <div class="hero">
          <div class="hero-shadow"></div>
          <div class="hero-crystal"></div>
        </div>

        <!-- 场景卡片 -->
        <div class="scene-card scene-1">
          <div class="card-inner">
            <div class="card-icon icon-1"></div>
            <div>
              <div class="card-eyebrow">01</div>
              <div class="card-title">Ancient Origins</div>
            </div>
          </div>
        </div>

        <div class="scene-card scene-2">
          <div class="card-inner">
            <div class="card-icon icon-2"></div>
            <div>
              <div class="card-eyebrow">02</div>
              <div class="card-title">Premium Quality</div>
            </div>
          </div>
        </div>

        <div class="scene-card scene-3">
          <div class="card-inner">
            <div class="card-icon icon-3"></div>
            <div>
              <div class="card-eyebrow">03</div>
              <div class="card-title">Master Craft</div>
            </div>
          </div>
        </div>

        <div class="scene-card scene-4">
          <div class="card-inner">
            <div class="card-icon icon-4"></div>
            <div>
              <div class="card-eyebrow">04</div>
              <div class="card-title">Our Collection</div>
            </div>
          </div>
        </div>

        <!-- 底部标题 -->
        <div class="title-bar">
          <div class="title-eyebrow">01 · ORIGIN</div>
          <h2 class="title-main">Ancient Origins</h2>
          <div class="title-line"></div>
        </div>

        <!-- 结尾 -->
        <div class="finale">
          <h2 class="finale-title">Thank You for Choosing CHENSHA</h2>
          <p class="finale-desc">Carry a piece of Chinese heritage with you.</p>
          <a href="#" class="finale-btn">Explore More</a>
        </div>

      </div>
    </div>
  </div>

  <!-- 进度条 -->
  <div class="progress">
    <div class="progress-fill"></div>
  </div>

  <script>
    const journey = document.querySelector('.journey-container');
    const hero = document.querySelector('.hero');
    const scenes = document.querySelectorAll('.scene-card');
    const finale = document.querySelector('.finale');
    const progressFill = document.querySelector('.progress-fill');
    const titleMain = document.querySelector('.title-main');
    const titleEyebrow = document.querySelector('.title-eyebrow');

    const sceneTitles = [
      'Ancient Origins',
      'Premium Quality',
      'Master Craft',
      'Our Collection'
    ];
    const sceneEyebrows = [
      '01 · ORIGIN',
      '02 · QUALITY',
      '03 · CRAFT',
      '04 · COLLECTION'
    ];

    function updateJourney() {
      const scrollTop = window.pageYOffset;
      const journeyTop = journey.offsetTop;
      const journeyHeight = journey.offsetHeight - window.innerHeight;
      const progress = Math.max(0, Math.min(1, (scrollTop - journeyTop) / journeyHeight));

      // 进度条
      progressFill.style.height = (progress * 100) + '%';

      // 主角向前走（变大）
      const scale = 1 + progress * 0.8;
      hero.style.transform = `translateX(-50%) scale(${scale})`;

      // 场景出现时机
      for (let i = 0; i < scenes.length; i++) {
        const threshold = (i + 1) * 0.18;
        if (progress > threshold) {
          scenes[i].classList.add('visible');
          titleMain.textContent = sceneTitles[i];
          titleEyebrow.textContent = sceneEyebrows[i];
        }
      }

      // 结尾
      if (progress > 0.85) {
        finale.classList.add('visible');
      } else {
        finale.classList.remove('visible');
      }

      // 视差
      const farLayer = document.querySelector('.layer-far');
      const midLayer = document.querySelector('.layer-mid');
      if (farLayer) farLayer.style.transform = `translateY(${progress * 30}px)`;
      if (midLayer) midLayer.style.transform = `translateY(${progress * 60}px)`;
    }

    window.addEventListener('scroll', updateJourney);
    updateJourney();
  </script>

</body>
</html>
