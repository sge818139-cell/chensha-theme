<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHENSHA - Into The Cinnabar Journey</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
      background: #FAF8F4;
      color: #2A1F1A;
      overflow-x: hidden;
    }

    /* 顶部导航 */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 25px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      background: transparent;
    }

    .nav-left {
      font-size: 14px;
      letter-spacing: 3px;
      color: #9E2B25;
      text-transform: uppercase;
    }

    .nav-logo {
      font-size: 32px;
      letter-spacing: 6px;
      color: #9E2B25;
      font-weight: 500;
    }

    .nav-right {
      font-size: 14px;
      letter-spacing: 3px;
      color: #9E2B25;
      text-transform: uppercase;
    }

    /* 主容器 */
    .journey-container {
      position: relative;
      height: 1000vh;
      background: #FAF8F4;
    }

    /* 固定视口 */
    .viewport {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* 场景 */
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* 背景层 - 两侧植物 */
    .bg-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .plant-left {
      position: absolute;
      left: -5%;
      top: 0;
      width: 45%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: left bottom;
      opacity: 0.3;
    }

    .plant-right {
      position: absolute;
      right: -5%;
      top: 0;
      width: 45%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: right bottom;
      opacity: 0.3;
    }

    .plant-bamboo-left {
      background-image: url('bamboo-leaf.png');
    }

    .plant-plum-right {
      background-image: url('plum-branch.png');
    }

    /* 地面小路 */
    .ground {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 30%;
      background: linear-gradient(180deg, 
        rgba(240, 235, 225, 0) 0%, 
        rgba(235, 228, 215, 0.6) 50%,
        rgba(230, 222, 205, 0.8) 100%
      );
      border-radius: 50% 50% 0 0;
    }

    /* 主角 - 朱砂原石 */
    .hero {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 120px;
      z-index: 10;
      transition: transform 0.05s linear;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .hero-shadow {
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 20px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }

    /* 中间大标题 */
    .main-title {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 8;
      transition: all 0.8s ease;
    }

    .main-eyebrow {
      font-size: 13px;
      letter-spacing: 6px;
      color: #9E2B25;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .main-heading {
      font-size: 64px;
      font-weight: 400;
      line-height: 1.1;
      color: #2A1F1A;
      margin-bottom: 25px;
    }

    .main-line {
      width: 60px;
      height: 2px;
      background: #9E2B25;
      margin: 0 auto;
    }

    /* 底部按钮 */
    .explore-btn {
      position: absolute;
      bottom: 25%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      padding: 16px 50px;
      background: transparent;
      border: 1px solid #9E2B25;
      color: #9E2B25;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .explore-btn:hover {
      background: #9E2B25;
      color: white;
    }

    /* 进度条 */
    .progress-bar {
      position: fixed;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 200px;
      background: rgba(158, 43, 37, 0.1);
      z-index: 100;
    }

    .progress-fill {
      width: 100%;
      height: 0%;
      background: #9E2B25;
      transition: height 0.1s linear;
    }

    @media (max-width: 768px) {
      .top-nav {
        padding: 20px;
      }
      .nav-logo {
        font-size: 24px;
      }
      .hero {
        width: 80px;
        height: 80px;
      }
      .main-heading {
        font-size: 42px;
      }
      .plant-left, .plant-right {
        width: 60%;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <nav class="top-nav">
    <div class="nav-left">JOURNEY</div>
    <div class="nav-logo">CHENSHA</div>
    <div class="nav-right">探索</div>
  </nav>

  <!-- 主旅程容器 -->
  <div class="journey-container">
    <div class="viewport">
      <div class="scene">

        <!-- 背景层 -->
        <div class="bg-layer">
          <div class="plant-left plant-bamboo-left"></div>
          <div class="plant-right plant-plum-right"></div>
        </div>

        <!-- 地面 -->
        <div class="ground"></div>

        <!-- 主角 -->
        <div class="hero">
          <div class="hero-shadow"></div>
          <img src="cinnabar-gem.png" alt="Cinnabar Gem">
        </div>

        <!-- 中间大标题 -->
        <div class="main-title">
          <div class="main-eyebrow">01 · ORIGIN</div>
          <h1 class="main-heading">Into The<br>Cinnabar</h1>
          <div class="main-line"></div>
        </div>

        <!-- 探索按钮 -->
        <button class="explore-btn">探索</button>

      </div>
    </div>
  </div>

  <!-- 进度条 -->
  <div class="progress-bar">
    <div class="progress-fill"></div>
  </div>

  <script>
    const journey = document.querySelector('.journey-container');
    const hero = document.querySelector('.hero');
    const progressFill = document.querySelector('.progress-fill');
    const mainHeading = document.querySelector('.main-heading');
    const mainEyebrow = document.querySelector('.main-eyebrow');
    const plantLeft = document.querySelector('.plant-left');
    const plantRight = document.querySelector('.plant-right');

    const titles = [
      'Into The<br>Cinnabar',
      'Ancient<br>Origins',
      'Premium<br>Quality',
      'Master<br>Craft',
      'Our<br>Collection'
    ];

    const eyebrows = [
      '01 · ORIGIN',
      '02 · QUALITY',
      '03 · CRAFT',
      '04 · COLLECTION',
      '05 · HERITAGE'
    ];

    function updateJourney() {
      const scrollTop = window.pageYOffset;
      const journeyTop = journey.offsetTop;
      const journeyHeight = journey.offsetHeight - window.innerHeight;
      const progress = Math.max(0, Math.min(1, (scrollTop - journeyTop) / journeyHeight));

      // 进度条
      progressFill.style.height = (progress * 100) + '%';

      // 主角向前走（变大）
      const scale = 1 + progress * 1.5;
      hero.style.transform = `translateX(-50%) scale(${scale})`;

      // 标题切换
      const titleIndex = Math.min(4, Math.floor(progress * 5));
      mainHeading.innerHTML = titles[titleIndex];
      mainEyebrow.textContent = eyebrows[titleIndex];

      // 视差
      if (plantLeft) plantLeft.style.transform = `translateX(${progress * -30}px)`;
      if (plantRight) plantRight.style.transform = `translateX(${progress * 30}px)`;
    }

    window.addEventListener('scroll', updateJourney);
    updateJourney();
  </script>

</body>
</html>
